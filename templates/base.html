<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Dashboard - SB Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet" />
        <link href="{% static 'css/styles.css' %}?v=1" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <header class="navbar-container">
    <!-- ชื่อสาขาฝั่งซ้าย -->
    <a class="brand-title" href="{% url 'home' %}">วิทยาการคอมพิวเตอร์</a>

    <!-- เมนูแบบ Liquid Navigation ฝั่งขวา -->
    <div class="liquid-nav">
        <ul>
            <!-- ใส่ class "active" ในหน้าปัจจุบัน -->
            <li class="list active">
                <a href="{% url 'home' %}">
                    <span class="icon"><i class="fas fa-home"></i></span>
                    <span class="text">หน้าหลัก</span>
                </a>
            </li>
            <li class="list">
                <a href="{% url 'about' %}">
                    <span class="icon"><i class="fas fa-info-circle"></i></span>
                    <span class="text">เกี่ยวกับเรา</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><i class="fas fa-book"></i></span>
                    <span class="text">หลักสูตร</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><i class="fas fa-graduation-cap"></i></span>
                    <span class="text">แผนการเรียน</span>
                </a>
            </li>
            <li class="list">
                <a href="#">
                    <span class="icon"><i class="fas fa-user-tie"></i></span>
                    <span class="text">คณาจารย์</span>
                </a>
            </li>
            <li class="list">
                <a href="{% url 'contact' %}">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <span class="text">ติดต่อเรา</span>
                </a>
            </li>
            
            <!-- ตัววงกลมที่จะสไลด์ไปตามเมนูที่ Active -->
            <div class="indicator"></div>
        </ul>
    </div>
</header>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                {% block content %}       
                {% endblock %}
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto">
                <div class="container-fluid px-4">
                    <div class="d-flex align-items-center justify-content-between small">
                        <div class="text-muted">Copyright &copy; Your Website 2021</div>
                        <div>
                            <a href="#">Privacy Policy</a>
                            &middot;
                            <a href="#">Terms &amp; Conditions</a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js' %}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'assets/demo/chart-area-demo.js' %}"></script>
        <script src="{% static 'assets/demo/chart-bar-demo.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
        <script src="{% static 'js/datatables-simple-demo.js' %}"></script>
    </body>
</html>
